<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOT — Free Infinite Canvas for Visual Project Boards</title>
  <meta name="description" content="Free infinite dotted canvas for organising projects visually. Arrange images, videos, text and arrows. Runs in your browser; nothing is uploaded." />
  <link rel="canonical" href="https://nisargb1994.github.io/dot/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DOT — Free Infinite Canvas for Visual Project Boards" />
  <meta property="og:description" content="Arrange images, videos, text and arrows on an infinite dotted grid. Free, private, in your browser." />
  <meta property="og:url" content="https://nisargb1994.github.io/dot/" />
  <meta name="twitter:card" content="summary" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"DOT","url":"https://nisargb1994.github.io/dot/","applicationCategory":"DesignApplication","operatingSystem":"Any (web browser)","description":"Free infinite dotted canvas for organising projects visually with images, videos, text and arrows.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Rail -->
    <nav class="rail">
      <div class="logo" title="DOT">
        <span class="logo-mark"></span>
        <span class="logo-text">DOT</span>
      </div>
      <div class="rail-icons">
        <button class="rail-btn active" id="railProjects" data-icon="projects" data-tip="Projects  ⌘\" aria-label="Show or hide projects" aria-pressed="true"></button>
        <button class="rail-btn" id="railAddProject" data-icon="addProject" data-tip="New project" aria-label="New project"></button>
        <button class="rail-btn" id="railAddFolder" data-icon="newFolder" data-tip="New folder" aria-label="New folder"></button>
      </div>
      <div class="rail-icons rail-bottom">
        <button class="rail-btn" id="railShortcuts" data-icon="keyboard" data-tip="Keyboard shortcuts  ?" aria-label="Keyboard shortcuts"></button>
      </div>
    </nav>

    <!-- Projects panel -->
    <aside class="panel" id="panel">
      <div class="panel-inner">
        <div class="panel-head">
          <h1 class="panel-title">Projects</h1>
        </div>
        <div class="project-list" id="projectList"></div>
        <div class="add-rows">
          <button class="add-row" id="addProject"><span class="add-plus">+</span> Add Project</button>
          <button class="add-row" id="addFolder"><span class="add-plus">+</span> Add Folder</button>
        </div>
      </div>
    </aside>

    <!-- Canvas -->
    <main class="stage" id="stage">
      <div class="canvas" id="canvas">
        <div class="world" id="world"></div>
      </div>

      <div class="toolbar">
        <button class="tb" data-tool="select" data-icon="select" title="Select (V)"></button>
        <button class="tb" data-tool="hand" data-icon="hand" title="Hand — pan (H, or hold Space)"></button>
        <button class="tb" data-tool="line" data-icon="line" title="Line — drag to draw, drop on an item to attach (A)"></button>
      </div>

      <div class="topbar">
        <div class="crumb"><span class="crumb-folder" id="crumbFolder" hidden></span><span class="crumb-name" id="crumbName">—</span><span class="crumb-count" id="crumbCount"></span></div>
      </div>

      <div class="empty" id="empty">
        <div class="empty-dot"></div>
        <div class="empty-title">This canvas is empty</div>
        <div class="empty-sub">Right-click anywhere to add images, videos or text,<br/>or drop files straight onto the grid.</div>
      </div>

      <div class="zoombar">
        <button class="zb disabled" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo" data-icon="undo"></button>
        <button class="zb disabled" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo" data-icon="redo"></button>
        <span class="zb-sep"></span>
        <button class="zb" id="locate" title="Back to last edited (L)" data-icon="locate"></button>
        <span class="zb-sep"></span>
        <button class="zb" id="zoomOut" title="Zoom out (−)">−</button>
        <button class="zb zb-label" id="zoomReset" title="Reset to 100% (Shift+0)">100%</button>
        <button class="zb" id="zoomIn" title="Zoom in (+)">+</button>
        <span class="zb-sep"></span>
        <button class="zb" id="zoomFit" title="Fit all (Shift+1)" data-icon="fit"></button>
      </div>

      <div class="help">Drag to select · Space-drag to pan · A for arrows · Shift-drag to snap · ⌘ + scroll to zoom</div>
    </main>
  </div>

  <div class="ctx" id="ctx" hidden></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
