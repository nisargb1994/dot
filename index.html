<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOT — Free Infinite Canvas for Visual Project Boards</title>
  <meta name="description" content="Free infinite dotted canvas for organising projects visually. Arrange images, videos, text and arrows. Runs in your browser; nothing is uploaded." />
  <link rel="canonical" href="https://nisargb1994.github.io/dot/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DOT — Free Infinite Canvas for Visual Project Boards" />
  <meta property="og:description" content="Arrange images, videos, text and arrows on an infinite dotted grid. Free, private, in your browser." />
  <meta property="og:url" content="https://nisargb1994.github.io/dot/" />
  <meta name="twitter:card" content="summary" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"DOT","url":"https://nisargb1994.github.io/dot/","applicationCategory":"DesignApplication","operatingSystem":"Any (web browser)","description":"Free infinite dotted canvas for organising projects visually with images, videos, text and arrows.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="locked">
  <div class="shell collapsed">
    <!-- Canvas -->
    <main class="stage" id="stage">
      <div class="canvas" id="canvas">
        <div class="world" id="world"></div>
      </div>

      <div class="toolbar">
        <button class="tb" data-tool="select" data-icon="select" title="Select (V)"></button>
        <button class="tb" data-tool="hand" data-icon="hand" title="Hand — pan (H, or hold Space)"></button>
        <button class="tb" data-tool="line" data-icon="line" title="Arrow — drag to draw, drop on an item to attach (A)"></button>
        <span class="tb-sep"></span>
        <button class="tb" id="textBtn" data-icon="text" title="Text (T)" aria-haspopup="true" aria-expanded="false"></button>
        <button class="tb" id="shapesBtn" data-icon="shapes" title="Shapes" aria-haspopup="true" aria-expanded="false"></button>
        <button class="tb" id="uploadBtn" data-icon="upload" title="Upload image or video (U)"></button>
        <button class="tb" id="linkBtn" data-icon="link" title="Add link — image, video, Instagram, Pinterest (K)"></button>
      </div>
      <div class="shape-pop" id="shapePop" hidden></div>
      <div class="shape-pop text-pop" id="textPop" hidden></div>
      <div class="selbar" id="selbar" hidden></div>

      <div class="topbar">
        <div class="crumb"><span class="crumb-folder" id="crumbFolder" hidden></span><span class="crumb-name" id="crumbName">—</span><span class="crumb-count" id="crumbCount"></span></div>
      </div>

      <div class="empty" id="empty">
        <div class="empty-dot"></div>
        <div class="empty-title">This canvas is empty</div>
        <div class="empty-sub">Right-click anywhere to add images, videos or text,<br/>or drop files straight onto the grid.</div>
      </div>

      <div class="zoombar">
        <button class="zb disabled" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo" data-icon="undo"></button>
        <button class="zb disabled" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo" data-icon="redo"></button>
        <span class="zb-sep"></span>
        <button class="zb" id="locate" title="Back to last edited (L)" data-icon="locate"></button>
        <span class="zb-sep"></span>
        <button class="zb" id="zoomOut" title="Zoom out (−)">−</button>
        <button class="zb zb-label" id="zoomReset" title="Reset to 100% (Shift+0)">100%</button>
        <button class="zb" id="zoomIn" title="Zoom in (+)">+</button>
        <span class="zb-sep"></span>
        <button class="zb" id="zoomFit" title="Fit all (Shift+1)" data-icon="fit"></button>
      </div>

      <div class="help">Drag to select · Space-drag to pan · A for arrows · Shift-drag to snap · ⌘ + scroll to zoom</div>
    </main>

    <!-- Floating DOT button: opens the projects panel -->
    <button class="dot-btn" id="dotBtn" aria-controls="panel" aria-expanded="false" title="Projects  ⌘\" aria-label="DOT — projects">
      <span class="logo-mark"></span>
    </button>

    <!-- Floating projects panel -->
    <aside class="panel" id="panel" aria-label="Projects">
      <div class="panel-inner">
        <div class="panel-head">
          <h1 class="panel-title">Projects</h1>
          <div class="panel-actions">
            <button class="icon-btn" id="panelShortcuts" data-icon="keyboard" title="Keyboard shortcuts  ?" aria-label="Keyboard shortcuts"></button>
          </div>
        </div>
        <div class="project-list" id="projectList"></div>
        <div class="add-rows">
          <button class="add-row" id="addProject"><span class="add-plus">+</span> Add Project</button>
          <button class="add-row" id="addFolder"><span class="add-plus">+</span> Add Folder</button>
        </div>
        <div class="me" id="me">
          <button class="me-btn" id="meBtn" aria-label="Your account">
            <span class="me-av" id="meAv"></span>
            <span class="me-text"><b id="meName"></b><span id="meSub"></span></span>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Sign in -->
  <div class="auth" id="auth" hidden>
    <form class="auth-card" id="authForm" novalidate autocomplete="on">
      <div class="auth-dot"><span class="logo-mark"></span></div>
      <p class="auth-tag">it all started with a dot.</p>
      <button type="button" class="auth-google" id="authGoogle">Continue with Google</button>
      <div class="auth-or"><span>or</span></div>
      <input class="auth-in" id="authId" name="username" placeholder="Email or username" autocomplete="username" autocapitalize="none" spellcheck="false" />
      <input class="auth-in" id="authPass" name="password" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="auth-err" id="authErr" role="alert"></div>
      <button type="submit" class="auth-go" id="authGo">Log in</button>
      <p class="auth-switch"><span id="authQ">New to DOT?</span> <button type="button" id="authMode">Create an account</button></p>
    </form>
  </div>

  <div class="ctx" id="ctx" hidden></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
